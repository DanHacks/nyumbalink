# NyumbaLink reverse proxy — nyumba.hytechsolution.co.ke
# HTTP redirects to HTTPS; HTTPS serves the SPA and proxies API/uploads/websockets.

server {
    listen 80;
    server_name nyumba.hytechsolution.co.ke;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nyumba.hytechsolution.co.ke;

    ssl_certificate     /etc/letsencrypt/live/nyumba.hytechsolution.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nyumba.hytechsolution.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # FastAPI backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Chat WebSocket (token passed as query param)
    location /api/v1/chat/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploaded media served by the API container
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health probe straight through
    location = /health {
        proxy_pass http://api:8000/health;
    }

    # React SPA (built by the frontend container)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
