name: Deploy to EC2 (manual SSH fallback)

# Production (https://heylaos.com) is deployed by a server-side git poll that
# lives ON the host: it pulls origin/main, rebuilds the stack and restarts it
# inside the same network as the Cloudflare Tunnel, then checks /health.
#
# This workflow is the emergency fallback only. It is NOT triggered by pushes,
# so it can never race the poll or rebuild the stack into a state that bypasses
# the tunnel. Run it from the Actions tab with "Run workflow".
#
# Before enabling it, set EC2_HOST / EC2_USER / EC2_SSH_KEY repository secrets
# and confirm the host's port 22 is reachable from GitHub-hosted runners
# (Lightsail static IPs are firewalled by default). See deploy/DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm a manual production deploy
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/nyumbalink
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build --pull api frontend celery_worker
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            curl -fsS https://heylaos.com/health > /dev/null && echo "Health check OK"
